<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cobra Slither</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05050a;
  font-family: Arial, Helvetica, sans-serif;
}
canvas {
  display: block;
  position: absolute;
  left: 0;
  top: 0;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0;

  var TAU = Math.PI * 2;
  var WORLD_R = 2000;
  var ORB_COUNT = 650;
  var BOT_COUNT = 15;
  var SPACING = 6;
  var MAX_PTS = 220;

  var PALETTE = ["#ff4d4d", "#ff9f1c", "#ffe14d", "#5cff6b", "#3ef2ff", "#4d7cff", "#b35cff", "#ff5cd6"];
  var BOT_COLORS = ["#ff7a7a", "#ffb347", "#fff07a", "#8dff8f", "#7af6ff", "#7a9dff", "#d08bff", "#ff8fe3", "#ffa3a3", "#ffd58a"];
  var BOT_NAMES = ["Nemo", "Zeta", "Kira", "Thor", "Luna", "Bolt", "Nina", "Rex", "Mia", "Ajax", "Dino", "Pixel", "Soda", "Vega", "Yuki", "Orion", "Lola"];

  var state = "menu";      // "menu" | "play" | "dead"
  var selIdx = 0;
  var orbs = [];
  var snakes = [];
  var player = null;
  var deadScore = 0;
  var camX = 0, camY = 0, zoom = 1;
  var frame = 0;
  var tilePattern = null;
  var lastTouchTime = 0;
  var joy = null;
  var touchBoostId = null;
  var mouseBoost = false;
  var mouse = { x: 0, y: 0, active: false };
  var keys = { left: false, right: false, up: false, down: false, space: false };
  var padPrev = {};
  var padState = null;

  /* ---------- utilidades ---------- */

  function rnd(a, b) { return a + Math.random() * (b - a); }

  function wrapA(a) {
    while (a > Math.PI) a -= TAU;
    while (a < -Math.PI) a += TAU;
    return a;
  }

  function clamp(v, lo, hi) {
    if (v < lo) return lo;
    if (v > hi) return hi;
    return v;
  }

  function randomPoint(maxR) {
    var a = Math.random() * TAU;
    var d = Math.sqrt(Math.random()) * maxR;
    return { x: Math.cos(a) * d, y: Math.sin(a) * d };
  }

  function clampPt(x, y) {
    var lim = WORLD_R - 30;
    var d2 = x * x + y * y;
    if (d2 > lim * lim) {
      var d = Math.sqrt(d2);
      x = x / d * lim;
      y = y / d * lim;
    }
    return { x: x, y: y };
  }

  function makeOrb(x, y, r, c, v) {
    return { x: x, y: y, r: r, c: c, v: v };
  }

  function spawnOrb() {
    var p = randomPoint(WORLD_R - 30);
    orbs.push(makeOrb(p.x, p.y, rnd(3, 5), PALETTE[Math.floor(Math.random() * PALETTE.length)], 0.6));
  }

  function initOrbs() {
    orbs = [];
    for (var i = 0; i < ORB_COUNT; i++) spawnOrb();
  }

  function inRect(x, y, r) {
    return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  }

  /* ---------- padrão hexagonal (pré-renderizado) ---------- */

  function makeTile() {
    var s = 20;
    var TW = Math.sqrt(3) * s * 2;
    var TH = 3 * s;
    var c = document.createElement("canvas");
    c.width = Math.ceil(TW);
    c.height = Math.ceil(TH);
    var g = c.getContext("2d");
    g.strokeStyle = "rgba(120, 60, 160, 0.45)";
    g.lineWidth = 1.5;
    var centers = [
      [0, 0], [TW, 0], [0, TH], [TW, TH],
      [TW / 2, 1.5 * s], [TW / 2, 1.5 * s - TH], [TW / 2, 1.5 * s + TH]
    ];
    for (var i = 0; i < centers.length; i++) {
      var cx = centers[i][0], cy = centers[i][1];
      g.beginPath();
      for (var k = 0; k < 6; k++) {
        var a = (Math.PI / 180) * (60 * k + 30);
        var x = cx + s * Math.cos(a);
        var y = cy + s * Math.sin(a);
        if (k === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.closePath();
      g.stroke();
    }
    return c;
  }

  /* ---------- cobras ---------- */

  function targetPts(s) {
    return Math.min(MAX_PTS, Math.floor(s.mass * 1.6) + 10);
  }

  function turnRateOf(s) {
    return Math.max(0.035, 0.1 - s.mass * 0.00012);
  }

  function makeSnake(name, color, isPlayer) {
    var p = randomPoint(WORLD_R * 0.75);
    var ang = rnd(0, TAU);
    var s = {
      name: name,
      color: color,
      isPlayer: isPlayer,
      x: p.x,
      y: p.y,
      ang: ang,
      body: [],
      mass: isPlayer ? 20 : rnd(12, 30),
      boost: false,
      alive: true,
      respawn: 0,
      boostTick: 0,
      aiWant: ang,
      aiBoost: false,
      aiTimer: 0,
      r0: 10
    };
    s.r0 = Math.min(26, 9 + Math.sqrt(s.mass) * 1.7);
    var n = targetPts(s);
    for (var i = 0; i < n; i++) {
      s.body.push({
        x: p.x - Math.cos(ang) * SPACING * (i + 1),
        y: p.y - Math.sin(ang) * SPACING * (i + 1)
      });
    }
    return s;
  }

  function stepSnake(s, want, turn, boost) {
    var d = wrapA(want - s.ang);
    if (d > turn) d = turn;
    else if (d < -turn) d = -turn;
    s.ang = wrapA(s.ang + d);

    s.boost = boost;
    var sp = boost ? 4.2 : 2.4;
    s.x += Math.cos(s.ang) * sp;
    s.y += Math.sin(s.ang) * sp;

    var b0 = s.body[0];
    var dx = s.x - b0.x, dy = s.y - b0.y;
    if (dx * dx + dy * dy >= SPACING * SPACING) {
      s.body.unshift({ x: s.x, y: s.y });
    }

    var tp = targetPts(s);
    while (s.body.length > tp) s.body.pop();

    s.r0 = Math.min(26, 9 + Math.sqrt(s.mass) * 1.7);
  }

  function boostDrop(s) {
    if (!s.boost) return;
    if (s.mass <= 12) {
      s.boost = false;
      return;
    }
    s.boostTick++;
    if (s.boostTick % 6 === 0) {
      s.mass -= 0.6;
      var t = s.body[s.body.length - 1];
      if (t) {
        var p = clampPt(t.x + rnd(-3, 3), t.y + rnd(-3, 3));
        orbs.push(makeOrb(p.x, p.y, 4.5, s.color, 0.6));
      }
    }
  }

  function killSnake(s) {
    if (!s.alive) return;
    s.alive = false;
    s.boost = false;

    var b = s.body, n = b.length, j, p;
    for (j = 0; j < n; j += 2) {
      p = clampPt(b[j].x + rnd(-5, 5), b[j].y + rnd(-5, 5));
      orbs.push(makeOrb(p.x, p.y, 4.5, s.color, 1.0));
    }

    var big = 8 + Math.min(16, Math.floor(s.mass / 10));
    for (var k = 0; k < big; k++) {
      var q = n > 0 ? b[Math.floor(Math.random() * n)] : { x: s.x, y: s.y };
      p = clampPt(q.x + rnd(-30, 30), q.y + rnd(-30, 30));
      orbs.push(makeOrb(p.x, p.y, 9, PALETTE[Math.floor(Math.random() * PALETTE.length)], 1.2));
    }

    if (s.isPlayer) {
      state = "dead";
      deadScore = Math.floor(s.mass * 10);
    } else {
      s.respawn = 150;
    }
  }

  /* ---------- IA dos bots ---------- */

  function blockedAt(s, ang) {
    var look = 95;
    var px = s.x + Math.cos(ang) * look;
    var py = s.y + Math.sin(ang) * look;
    var lim = WORLD_R - 70;
    if (px * px + py * py > lim * lim) return true;

    for (var i = 0; i < snakes.length; i++) {
      var o = snakes[i];
      if (!o.alive) continue;
      var rr = o.r0 * 0.9 + 26;
      var rr2 = rr * rr;
      var b = o.body;
      for (var j = 0; j < b.length; j += 2) {
        if (o === s && j < 12) continue;
        var dx = px - b[j].x, dy = py - b[j].y;
        if (dx * dx + dy * dy < rr2) return true;
      }
    }
    return false;
  }

  function botThink(s) {
    var dc = Math.sqrt(s.x * s.x + s.y * s.y);
    var want;
    var danger = false;
    var nearest = null;
    var bestD2 = 360 * 360;

    if (dc > WORLD_R - 380) {
      want = Math.atan2(-s.y, -s.x);
    } else {
      for (var i = 0; i < orbs.length; i++) {
        var o = orbs[i];
        var dx = o.x - s.x, dy = o.y - s.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < bestD2) {
          bestD2 = d2;
          nearest = o;
        }
      }

      want = nearest
        ? Math.atan2(nearest.y - s.y, nearest.x - s.x)
        : s.ang + rnd(-0.6, 0.6);

      if (blockedAt(s, want)) {
        danger = true;
        var alts = [0.5, -0.5, 1.0, -1.0, 1.7, -1.7, 2.4, -2.4, 3.0, -3.0];
        var found = false;
        for (var a = 0; a < alts.length; a++) {
          var c = want + alts[a];
          if (!blockedAt(s, c)) {
            want = c;
            found = true;
            break;
          }
        }
        if (!found) want = s.ang + 1.2;
      }
    }

    s.aiWant = want;
    s.aiBoost = (danger && s.mass > 18) ||
                (!danger && nearest && bestD2 < 140 * 140 && s.mass > 30 && Math.random() < 0.4);
  }

  /* ---------- controles ---------- */

  function isDown(pad, i) {
    var b = pad.buttons ? pad.buttons[i] : null;
    if (b === null || b === undefined) return false;
    if (typeof b === "number") return b > 0.5;
    return !!(b.pressed || b.value > 0.5);
  }

  function readPad() {
    var list = null;
    try {
      if (navigator.getGamepads) list = navigator.getGamepads();
      else if (navigator.webkitGetGamepads) list = navigator.webkitGetGamepads();
    } catch (e) {
      list = null;
    }

    var pad = null;
    if (list) {
      for (var i = 0; i < list.length; i++) {
        if (list[i]) { pad = list[i]; break; }
      }
    }

    if (!pad) {
      padState = null;
      return;
    }

    var ax = pad.axes ? (pad.axes[0] || 0) : 0;
    var ay = pad.axes ? (pad.axes[1] || 0) : 0;
    var mag = Math.sqrt(ax * ax + ay * ay);
    if (mag > 1) mag = 1;

    padState = {
      mag: mag,
      ang: Math.atan2(ay, ax),
      boost: isDown(pad, 0) || isDown(pad, 7),
      cross: isDown(pad, 0),
      circle: isDown(pad, 1),
      left: isDown(pad, 14),
      right: isDown(pad, 15)
    };
  }

  function edge(key, val) {
    var was = !!padPrev[key];
    padPrev[key] = !!val;
    return !!val && !was;
  }

  function edgeFlags() {
    var f = { left: false, right: false, confirm: false, back: false };
    if (padState) {
      f.left = edge("left", padState.left);
      f.right = edge("right", padState.right);
      f.confirm = edge("cross", padState.cross);
      f.back = edge("circle", padState.circle);
    }
    return f;
  }

  function boostHeld() {
    return touchBoostId !== null ||
           keys.space ||
           mouseBoost ||
           !!(padState && padState.boost);
  }

  function getControl() {
    var c = { active: false, ang: 0 };
    var dirAng = null;

    if (padState && padState.mag > 0.2) dirAng = padState.ang;

    if (dirAng === null && joy) {
      var jx = joy.x - joy.ox, jy = joy.y - joy.oy;
      if (jx * jx + jy * jy > 64) dirAng = Math.atan2(jy, jx);
    }

    if (dirAng === null) {
      var kx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      var ky = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
      if (kx || ky) dirAng = Math.atan2(ky, kx);
    }

    if (dirAng === null && mouse.active) {
      dirAng = Math.atan2(mouse.y - H / 2, mouse.x - W / 2);
    }

    if (dirAng !== null) {
      c.active = true;
      c.ang = dirAng;
    }
    return c;
  }

  /* ---------- atualização do mundo ---------- */

  function updatePlayer() {
    if (!player || !player.alive) return;
    var c = getControl();
    var want = c.active ? c.ang : player.ang;
    var boost = boostHeld() && player.mass > 12;
    stepSnake(player, want, turnRateOf(player), boost);
    boostDrop(player);
  }

  function updateBots() {
    for (var i = 0; i < snakes.length; i++) {
      var s = snakes[i];
      if (s.isPlayer || !s.alive) continue;
      s.aiTimer--;
      if (s.aiTimer <= 0) {
        botThink(s);
        s.aiTimer = 6 + Math.floor(Math.random() * 4);
      }
      stepSnake(s, s.aiWant, turnRateOf(s) * 0.85, !!s.aiBoost && s.mass > 15);
      boostDrop(s);
    }
  }

  function eatOrbs() {
    for (var i = 0; i < snakes.length; i++) {
      var s = snakes[i];
      if (!s.alive) continue;
      var reach = s.r0 * 0.9;
      for (var k = orbs.length - 1; k >= 0; k--) {
        var o = orbs[k];
        var dx = o.x - s.x, dy = o.y - s.y;
        var lim = reach + o.r;
        if (dx * dx + dy * dy < lim * lim) {
          s.mass += o.v;
          orbs[k] = orbs[orbs.length - 1];
          orbs.pop();
          spawnOrb();
        }
      }
    }
  }

  function checkCollisions() {
    for (var i = 0; i < snakes.length; i++) {
      var s = snakes[i];
      if (!s.alive) continue;

      if (s.x * s.x + s.y * s.y > WORLD_R * WORLD_R) {
        killSnake(s);
        continue;
      }

      var dead = false;
      var b = s.body;

      /* colisão com o próprio corpo (pula a parte perto da cabeça) */
      for (var j = 12; j < b.length; j++) {
        var dx = s.x - b[j].x, dy = s.y - b[j].y;
        var limSelf = s.r0 * 1.1;
        if (dx * dx + dy * dy < limSelf * limSelf) {
          dead = true;
          break;
        }
      }
      if (dead) {
        killSnake(s);
        continue;
      }

      /* colisão com outras cobras */
      for (var m = 0; m < snakes.length && !dead; m++) {
        var o = snakes[m];
        if (o === s || !o.alive) continue;

        var hx = s.x - o.x, hy = s.y - o.y;
        var hl = (s.r0 + o.r0) * 0.7;
        if (hx * hx + hy * hy < hl * hl) {
          dead = true;
          killSnake(o);
          break;
        }

        var ob = o.body;
        var lim = s.r0 * 0.8 + o.r0 * 0.7;
        var lim2 = lim * lim;
        for (var n = 0; n < ob.length; n++) {
          var ex = s.x - ob[n].x, ey = s.y - ob[n].y;
          if (ex * ex + ey * ey < lim2) {
            dead = true;
            break;
          }
        }
      }

      if (dead) killSnake(s);
    }
  }

  function respawnBots() {
    for (var i = 0; i < snakes.length; i++) {
      var s = snakes[i];
      if (s.isPlayer || s.alive) continue;
      s.respawn--;
      if (s.respawn <= 0) {
        snakes[i] = makeSnake(
          BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)],
          BOT_COLORS[Math.floor(Math.random() * BOT_COLORS.length)],
          false
        );
      }
    }
  }

  function startGame() {
    player = makeSnake("Você", PALETTE[selIdx], true);
    snakes = [player];
    for (var i = 0; i < BOT_COUNT; i++) {
      snakes.push(makeSnake(
        BOT_NAMES[i % BOT_NAMES.length],
        BOT_COLORS[i % BOT_COLORS.length],
        false
      ));
    }
    camX = player.x;
    camY = player.y;
    zoom = 1;
    joy = null;
    touchBoostId = null;
    mouseBoost = false;
    state = "play";
  }

  function update() {
    frame++;
    readPad();
    var pe = edgeFlags();

    if (orbs.length > ORB_COUNT + 500) {
      orbs.splice(0, orbs.length - (ORB_COUNT + 500));
    }

    if (state === "menu") {
      if (pe.left) selIdx = Math.max(0, selIdx - 1);
      if (pe.right) selIdx = Math.min(PALETTE.length - 1, selIdx + 1);
      if (pe.confirm) startGame();
      return;
    }

    if (state === "dead") {
      if (pe.confirm) {
        startGame();
        return;
      }
      if (pe.back) {
        state = "menu";
        return;
      }
    }

    if (state === "play") updatePlayer();

    updateBots();
    eatOrbs();
    checkCollisions();
    respawnBots();

    if (player) {
      camX += (player.x - camX) * 0.12;
      camY += (player.y - camY) * 0.12;
      var tz = clamp(1.15 - player.mass * 0.0009, 0.5, 1.15);
      zoom += (tz - zoom) * 0.04;
    }
  }

  /* ---------- desenho ---------- */

  function drawEye(x, y, r, ca, sa) {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#111111";
    ctx.beginPath();
    ctx.arc(x + ca * r * 0.35, y + sa * r * 0.35, r * 0.5, 0, TAU);
    ctx.fill();
  }

  function drawHead(x, y, r, ang) {
    var ca = Math.cos(ang), sa = Math.sin(ang);
    var fx = ca * r * 0.45, fy = sa * r * 0.45;
    var px = -sa * r * 0.42, py = ca * r * 0.42;
    drawEye(x + fx + px, y + fy + py, r * 0.34, ca, sa);
    drawEye(x + fx - px, y + fy - py, r * 0.34, ca, sa);
  }

  function drawArena() {
    ctx.beginPath();
    ctx.arc(0, 0, WORLD_R, 0, TAU);
    ctx.fillStyle = "#170a22";
    ctx.fill();

    if (tilePattern) {
      ctx.fillStyle = tilePattern;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(0, 0, WORLD_R, 0, TAU);
    ctx.lineWidth = 70;
    ctx.strokeStyle = "rgba(255, 30, 30, 0.12)";
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, WORLD_R, 0, TAU);
    ctx.lineWidth = 28;
    ctx.strokeStyle = "rgba(255, 30, 30, 0.35)";
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, WORLD_R, 0, TAU);
    ctx.lineWidth = 10;
    ctx.strokeStyle = "#ff2a2a";
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, WORLD_R, 0, TAU);
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#ffb3b3";
    ctx.stroke();
  }

  function drawOrbs() {
    var halfW = W / 2 / zoom + 40;
    var halfH = H / 2 / zoom + 40;
    for (var i = 0; i < orbs.length; i++) {
      var o = orbs[i];
      if (Math.abs(o.x - camX) > halfW || Math.abs(o.y - camY) > halfH) continue;
      if (o.v >= 1.0) {
        ctx.globalAlpha = 0.25;
        ctx.fillStyle = o.c;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r * 2.1, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = o.c;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, TAU);
      ctx.fill();
    }
  }

  function drawSnakes() {
    for (var i = 0; i < snakes.length; i++) {
      var s = snakes[i];
      if (!s.alive) continue;

      var r0 = s.r0;
      var n = s.body.length;
      var step = n > 120 ? 2 : 1;

      if (s.boost) {
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, r0 * 2.1, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      ctx.fillStyle = s.color;
      for (var j = n - 1; j >= 0; j -= step) {
        var p = s.body[j];
        var rr = r0 * (1 - 0.45 * j / n);
        ctx.beginPath();
        ctx.arc(p.x, p.y, rr, 0, TAU);
        ctx.fill();
      }

      if (step === 1) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.16)";
        for (var k = 0; k < n; k += 2) {
          var q = s.body[k];
          var rq = r0 * (1 - 0.45 * k / n);
          ctx.beginPath();
          ctx.arc(q.x, q.y, rq * 0.5, 0, TAU);
          ctx.fill();
        }
      }

      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r0, 0, TAU);
      ctx.fill();

      if (s.boost) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
        ctx.beginPath();
        ctx.arc(s.x, s.y, r0 * 0.6, 0, TAU);
        ctx.fill();
      }

      drawHead(s.x, s.y, r0, s.ang);

      ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
      ctx.font = "bold 12px Arial";
      ctx.textAlign = "center";
      ctx.fillText(s.name, s.x, s.y - r0 - 10);
    }
  }

  function drawMinimap() {
    var mr = 60;
    var mx = mr + 16;
    var my = H - mr - 16;

    ctx.beginPath();

        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, TAU);
        ctx.fill();
      } else {
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(px, py, 2.5, 0, TAU);
        ctx.fill();
      }
    }
  }
